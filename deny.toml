# What `cargo deny check` allows: licences, known security advisories,
# duplicate crates and where crates come from. CI runs it on every change.

[graph]
# The platforms the CLI is released for, so crates used only on one of them
# (the Windows and macOS keychains) are checked too.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Every advisory fails the check, including unmaintained crates.
unmaintained = "all"
yanked = "deny"
ignore = [
    # zvariant, zvariant_derive and zbus_names were merged into zbus 6 and
    # are no longer released on their own. They reach the CLI only through
    # the Linux keychain (keyring -> secret-service -> zbus 5), and
    # secret-service has no zbus 6 release yet. These are maintenance
    # notices, not vulnerabilities. Remove them when secret-service moves on.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; waiting on secret-service" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; waiting on secret-service" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; waiting on secret-service" },
]

[licenses]
# Permissive licences only, all compatible with shipping under MIT.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # Used unchanged by `directories` to find the config folder. MPL-2.0
    # covers only that crate's own files.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Crates come from crates.io and nowhere else.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
