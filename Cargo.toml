[package]
name = "invoist-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The Invoist command line and terminal app: read invoices, work through checks, and see what's due, from your terminal."
license = "MIT"
homepage = "https://invoi.st/docs/cli"
repository = "https://github.com/invoisthq/cli"
readme = "README.md"
keywords = ["invoist", "invoice", "cli", "tui", "bills"]
categories = ["command-line-utilities", "finance"]
include = ["src/**/*.rs", "src/tui/snapshots/*.snap", "tests/**/*.rs", "tests/fixtures/*.json", "tests/snapshots/*.snap", "examples/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md"]

[[bin]]
name = "invoist"
path = "src/main.rs"

[dependencies]
invoist = "1.0.1"
anstream = "1.0.0"
anstyle = "1.0.14"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
directories = "6.0.0"
getrandom = "0.4.3"
indicatif = "0.18.6"
keyring = "4.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "net", "io-util", "io-std", "time", "sync", "signal"] }
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package]
insta.opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
